name: snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate snake
        uses: Platane/snk@v3.2.0
        with:
          github_user_name: UXinCode
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=#3b82f6&color_dots=#0f172a,#1e293b,#3b82f6,#60a5fa,#ec4899
            dist/snake-light.svg?palette=github-light&color_snake=#3b82f6&color_dots=#ebedf0,#9be9a8,#40c463,#30a14e,#216e39

      - name: Push snake
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: snake
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
