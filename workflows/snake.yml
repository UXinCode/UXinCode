name: snake card

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: UXinCode
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=#3b82f6&color_dots=#0f172a,#1e293b,#3b82f6,#60a5fa,#ec4899
            dist/snake-light.svg?palette=github-light&color_snake=#3b82f6&color_dots=#ebedf0,#9be9a8,#40c463,#30a14e,#216e39

      - name: Publish to snake branch
        working-directory: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b snake
          git add snake.svg snake-light.svg
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "chore: update snake"
          git push -f -q "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" snake
